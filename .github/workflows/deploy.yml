name: Deploy portal

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'infra/**'
      - 'public/**'
      - 'public-admin/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # Not script_stop: that aborts at the first failing command, which
          # skips the rollback below and leaves the droplet halfway through a
          # deploy. The trap handles failures instead.
          script_stop: false
          script: |
            set -euo pipefail

            cd /opt/chav
            PREVIOUS="$(git rev-parse HEAD)"
            echo "current revision: $PREVIOUS"

            # Any failure from here on puts the droplet back where it was.
            # Reached by the trap on an error and by the health gate below,
            # so there is one rollback path rather than two.
            roll_back() {
              echo "::error::deploy failed — rolling back to $PREVIOUS"
              cd /opt/chav
              git reset --hard "$PREVIOUS"
              (cd server && npm ci --omit=dev) || true
              sudo /usr/bin/systemctl restart portal || true
              exit 1
            }
            trap roll_back ERR

            git fetch --quiet origin main
            git reset --hard origin/main

            cd server
            npm ci --omit=dev

            # DATABASE_URL is only in /etc/portal/db.env, which this user
            # cannot read. One fixed root-owned command, named in sudoers.
            sudo /usr/local/bin/portal-migrate

            sudo /usr/bin/systemctl restart portal

            # Past this point a failure is the health gate's to report, and the
            # trap would fire on the loop's own non-zero curl.
            trap - ERR

            for i in $(seq 1 30); do
              if curl -fsS --max-time 2 http://127.0.0.1:3000/readyz >/dev/null 2>&1; then
                echo "healthy after ${i}s"
                exit 0
              fi
              sleep 1
            done

            echo "::error::portal did not become healthy in 30s"
            roll_back
